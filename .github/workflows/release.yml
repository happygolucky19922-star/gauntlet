name: Package Lucy release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: bash scripts/package_build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucy-build
          path: dist/lucy-build-*.tar.gz
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lucy-build-*.tar.gz
